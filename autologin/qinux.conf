# autologin.conf.d drop-in for the live session.
#
# Only used by an installed system: the live session logs in through the
# qinux-live-autologin unit instead, which does not touch PAM at all.
#
# PAM autologin means anyone who boots the machine is root. That is acceptable
# only on a medium the user controls: a live USB, a recovery disk, a VM image.
# It is never acceptable on an installed Qinux system, and this file is
# installed by the live package, which the installer removes.

[Autologin]
User=qinux
Group=users
Session=plasma
# Not automatic: a machine that automounts its own home directory on a shared
# filesystem mounts it with the live user's credentials.
AutomaticLoginEnable=false

# A delay, so holding a key at the right moment gets you a normal login.
# Zero means a keypress during the window is silently swallowed, which looks
# like a dead keyboard.
AutoLoginDelay=2
