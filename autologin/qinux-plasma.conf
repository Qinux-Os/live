# Live-session Plasma configuration.
#
# The live session is a different job from an installed desktop: the user has
# to find the installer quickly, and the installer is the only thing that
# matters. Everything here serves that.

[Desktop Entry]
Type=Application
Name=Qinux Live Session
Comment=Start the live desktop session
Exec=startplasma-wayland
Icon=distributor-logo
Terminal=false
NoDisplay=false
X-KDE-autostart-phase=Applications
X-KDE-autostart-after=panel
